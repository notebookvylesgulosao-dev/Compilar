name: Build from zip

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Extract project zip
        run: |
          echo "Arquivos no repositorio:"
          find . -maxdepth 3 -not -path './.git/*' | sort
          ZIP=$(find . -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::Nenhum arquivo .zip encontrado no repositorio. Envie o zip do projeto."
            exit 1
          fi
          echo "Usando: $ZIP"
          unzip -q "$ZIP" -d /tmp/proj
          GRADLEW=$(find /tmp/proj -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew nao encontrado dentro do zip."
            exit 1
          fi
          echo "PROJ_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"
      - name: Build
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: wandryhp-jar
          path: ${{ env.PROJ_DIR }}/build/libs/*.jar
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls "$PROJ_DIR"/build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          gh release create "build-${{ github.run_number }}" "$JAR" \
            --title "WandryHP build ${{ github.run_number }}" \
            --notes "Mod compilado automaticamente."
