name: Build from zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Extract project zip
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using $ZIP"
          mkdir proj && unzip -q "$ZIP" -d proj
          GRADLEW=$(find proj -name gradlew -not -path '*/node_modules/*' | head -n 1)
          echo "PROJ_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"
      - name: Build
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: wandryhp-jar
          path: ${{ env.PROJ_DIR }}/build/libs/*.jar
